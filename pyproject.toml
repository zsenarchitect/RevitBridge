[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revit-bridge"
version = "0.1.0"
description = "Open-source Revit <-> 3D file converter toolkit (IFC hub, honest capability matrix)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sen Zhang", email = "zsenarchitect@users.noreply.github.com" }]
keywords = ["revit", "rvt", "ifc", "bim", "gltf", "converter", "ifcopenshell"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "ifcopenshell",
    "trimesh",
    "numpy",
    "olefile",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
revit-convert = "revit_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/zsenarchitect/RevitBridge"
Repository = "https://github.com/zsenarchitect/RevitBridge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
