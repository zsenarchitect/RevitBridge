<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RevitBridge — free converter, pay for machine time</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  .card { border: 1px solid #8884; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
  #drop { border: 2px dashed #8888; border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; }
  #drop.over { border-color: #4a90d9; background: #4a90d918; }
  label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
  select, button { font-size: 1rem; padding: .5rem .75rem; border-radius: 8px; }
  button { background: #4a90d9; color: #fff; border: none; cursor: pointer; margin-top: 1rem; }
  button:disabled { opacity: .5; cursor: default; }
  #progress { height: 10px; background: #8883; border-radius: 6px; overflow: hidden; margin-top: 1rem; display: none; }
  #bar { height: 100%; width: 0%; background: #4a90d9; transition: width .3s; }
  #status { margin-top: .75rem; min-height: 1.5em; }
  .meta { color: #888; font-size: .85rem; }
  a.dl { display: inline-block; margin-top: .5rem; font-size: 1.1rem; }
</style>
</head>
<body>
<h1>RevitBridge</h1>
<p class="meta">Open-source converter. The software is free — you pay only for the machine time your conversion uses.</p>

<div class="card">
  <div id="drop">Drop a <b>.rvt / .rfa / .ifc / .obj / .glb</b> file here, or click to choose</div>
  <input type="file" id="file" hidden>
  <label for="to">Convert to</label>
  <select id="to"></select>
  <label for="backend">Backend</label>
  <select id="backend"></select>
  <div class="meta" id="fileinfo"></div>
  <button id="go" disabled>Convert</button>
  <div id="progress"><div id="bar"></div></div>
  <div id="status"></div>
</div>
<div class="card meta" id="about"></div>

<script>
const $ = id => document.getElementById(id);
let file = null, timer = null;

fetch('/api/formats').then(r => r.json()).then(f => {
  $('to').innerHTML = f.outputs.map(o => `<option value="${o}">.${o}</option>`).join('');
});
fetch('/api/backends').then(r => r.json()).then(b => {
  $('backend').innerHTML = `<option value="">auto (recommended)</option>` +
    Object.entries(b).map(([k, v]) => `<option value="${k}">${k} — ${v.status}</option>`).join('');
  $('about').innerHTML = '<b>Backends:</b><br>' + Object.entries(b)
    .map(([k, v]) => `<code>${k}</code> [${v.status}] ${v.note}`).join('<br>');
});

const drop = $('drop');
drop.onclick = () => $('file').click();
['dragover', 'dragenter'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => setFile(ev.dataTransfer.files[0]));
$('file').addEventListener('change', ev => setFile(ev.target.files[0]));

function setFile(f) {
  if (!f) return;
  file = f;
  $('fileinfo').textContent = `${f.name} (${(f.size / 1024).toFixed(1)} KB)`;
  $('go').disabled = false;
  $('status').textContent = '';
}

$('go').onclick = async () => {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('to', $('to').value);
  if ($('backend').value) fd.append('backend', $('backend').value);
  $('go').disabled = true;
  $('progress').style.display = 'block';
  $('status').textContent = 'Uploading…';
  const res = await fetch('/api/jobs', { method: 'POST', body: fd });
  if (!res.ok) { $('status').textContent = 'Error: ' + (await res.json()).detail; $('go').disabled = false; return; }
  const { job_id } = await res.json();
  timer = setInterval(() => poll(job_id), 1000);
};

async function poll(job_id) {
  const j = await (await fetch(`/api/jobs/${job_id}`)).json();
  $('bar').style.width = j.progress + '%';
  $('status').textContent = `Status: ${j.status} — ${j.progress}%` + (j.error ? ` — ${j.error}` : '');
  if (j.status === 'done') {
    clearInterval(timer);
    $('status').innerHTML = `Done in ${j.metered_seconds.toFixed(2)}s of machine time` +
      (j.cost_usd ? ` · estimated $${j.cost_usd.toFixed(4)}` : '') +
      `<br><a class="dl" href="${j.download_url}">⬇ Download .${j.dst_fmt}</a>`;
    $('go').disabled = false;
  } else if (j.status === 'failed') {
    clearInterval(timer);
    $('status').textContent = 'Failed: ' + j.error;
    $('go').disabled = false;
  }
}
</script>
</body>
</html>
