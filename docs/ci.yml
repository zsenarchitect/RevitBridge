# CI workflow — MOVE ME before use
#
# This file belongs at `.github/workflows/ci.yml`. It lives here because the
# sandbox's GitHub token lacks the `workflow` scope, so pushes touching
# `.github/workflows/` are rejected. Once the token is re-authorized (device
# flow), move this file to `.github/workflows/ci.yml` and push.
#
# ---8<--- file content starts here ---8<---
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,web]"
      - name: Tests (no Revit, no APS credentials needed)
        run: pytest -q
